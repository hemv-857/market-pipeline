[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mktflow"
version = "0.1.0"
description = "Real-time crypto market data pipeline: WS ingest -> Redis Streams -> features -> FastAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hemang" }]
keywords = ["real-time", "redis-streams", "market-data", "asyncio", "fastapi"]
dependencies = [
    "numpy>=1.26",
    "websockets>=12",
    "redis>=5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "httpx"]

[project.scripts]
mktflow-ingest = "mktflow.ingestor:main"
mktflow-worker = "mktflow.worker:main"
mktflow-api = "mktflow.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mktflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# blocking append is deliberate at these rates; see ponytail note in ingestor
"src/mktflow/ingestor.py" = ["ASYNC230"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
